name: Cask checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cask-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cask:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register the checked-out tap
        run: |
          test "$(uname -m)" = arm64
          brew tap --custom-remote keycrumb/tap "$GITHUB_WORKSPACE"
          brew trust --cask keycrumb/tap/keycrumb
      - name: Style and online audit
        run: |
          brew style --cask keycrumb/tap/keycrumb
          brew audit --cask --online keycrumb/tap/keycrumb
      - name: Install and assess the published app
        run: |
          brew install --cask keycrumb/tap/keycrumb
          codesign --verify --deep --strict /Applications/KeyCrumb.app
          spctl --assess --type execute --verbose=2 /Applications/KeyCrumb.app
      - name: Launch the app
        timeout-minutes: 2
        run: |
          /Applications/KeyCrumb.app/Contents/MacOS/KeyCrumb > "$RUNNER_TEMP/keycrumb.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || test "$?" = 143
      - name: Preserve sandbox preferences through reinstall and uninstall
        timeout-minutes: 3
        run: |
          preferences="$HOME/Library/Containers/com.keycrumb.app/Data/Library/Preferences/com.keycrumb.app.plist"
          test -f "$preferences"
          defaults write "$preferences" HomebrewSmokeTest -bool true
          brew reinstall --cask keycrumb/tap/keycrumb
          test "$(defaults read "$preferences" HomebrewSmokeTest)" = 1
          brew uninstall --cask keycrumb/tap/keycrumb
          test ! -e /Applications/KeyCrumb.app
          test "$(defaults read "$preferences" HomebrewSmokeTest)" = 1
